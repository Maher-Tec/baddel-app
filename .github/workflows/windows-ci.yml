name: Windows CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify and build Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: baddel-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14

  release:
    name: Package and publish installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $inno = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $inno)) {
            choco install innosetup --no-progress --yes
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $inno "/DMyAppVersion=$version" 'installer\baddel_installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/installer/BaddelSetup.exe
